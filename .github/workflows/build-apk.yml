name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un clic en GitHub

jobs:
  build-apk:
    name: Generar APK de Rastreo Vehicular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Sincronizar archivos móviles con Capacitor
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK generado como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Vehicular-Instalador-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
